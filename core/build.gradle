plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.example.core'
    compileSdk 34

    defaultConfig {
        minSdk 21

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug{
            buildConfigField "String", "BASE_URL", "\"${getProperty("local.properties", "GITHUB_BASE_URL")}\""
            buildConfigField "String", "TOKEN", "\"${getProperty("local.properties", "GITHUB_TOKEN")}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", "\"${getProperty("local.properties", "GITHUB_BASE_URL")}\""
            buildConfigField "String", "TOKEN", "\"${getProperty("local.properties", "GITHUB_TOKEN")}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures{
        buildConfig = true
        viewBinding = true
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    //Testing
    testApi 'junit:junit:4.13.2'
    androidTestApi 'androidx.test.ext:junit:1.2.1'
    androidTestApi 'androidx.test.espresso:espresso-core:3.6.1'

    //Imageview
    api 'de.hdodenhof:circleimageview:3.1.0'
    api 'com.github.bumptech.glide:glide:4.15.0'

    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.9.0"

    //Ktx
    implementation "androidx.activity:activity-ktx:1.9.2"

    //coroutine support
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.6" //liveData
    implementation "androidx.room:room-ktx:2.6.1"

    //room
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6"
    implementation "androidx.room:room-runtime:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"

    //Datastore
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    //Dagger-Hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-android-compiler:$hilt_version"
}

def getProperty(String filename, String propName) {
    def propsFile = rootProject.file(filename)
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        if (props[propName] != null) {
            return props[propName]
        } else {
            throw GradleException("No such property " + propName + " in file " + filename)
        }
    } else {
        throw GradleException(filename + " does not exist!")
    }
}